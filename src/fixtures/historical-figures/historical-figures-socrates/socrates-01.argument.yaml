title: "Trial of Socrates: Crito"
description: ""
claims:
    - symbol: harmful_cowardice_fear
      title: Zeal can be dangerous
      body:
          Socrates says Crito’s eagerness helps only if it is right; if wrong, great
          zeal increases danger and must be checked by reflection.
    - symbol: follow_divine_will
      title: Socrates follows God’s will
      body:
          Socrates ends by leaving the matter to God’s will and following wherever
          that guidance leads.
    - symbol: atonement_over_escape
      title: Socrates must not escape
      body:
          Socrates decides that escaping would violate justice, break his agreements
          with the laws, and wrong his country, friends, and himself.
    - symbol: no_willful_wrongdoing
      title: Wrongdoing is never right
      body:
          Socrates maintains that one must never intentionally do wrong, and that
          injustice is always evil and dishonorable.
      axiom: background-assumption
    - symbol: laws_must_be_obeyed_or_persuaded
      title: Laws require obedience or persuasion
      body:
          The laws assert that a citizen must obey them or persuade them they are
          wrong; otherwise he must endure their punishments without resistance.
      axiom: domain-rule
    - symbol: socrates_obeys_reason
      title: Reason governs Socrates
      body:
          Socrates says he has always followed the best reasoning available to him
          and will not abandon his principles unless better ones are found.
    - symbol: many_lack_moral_power
      title: The many cannot do greatest evil
      body:
          Socrates argues that the many cannot make a person wise or foolish, so
          they can do neither the greatest good nor the greatest evil.
      axiom: background-assumption
    - symbol: wealth_can_fund_escape
      title: Escape is affordable
      body:
          Crito says Socrates can be freed at little cost because his own money and
          money from other supporters are available.
    - symbol: justice_first_life_second
      title: Justice outranks life
      body:
          Socrates concludes that one must value a good, just, and honorable life
          above mere survival, so consequences like death or loss do not decide the
          moral question.
    - symbol: no_retaliation_rule
      title: Retaliation is unjust
      body:
          Socrates holds that one must not injure in return or repay evil with evil,
          because doing evil to another is itself wrong.
      axiom: background-assumption
    - symbol: escape_protects_friends
      title: Escape could harm friends
      body:
          Crito fears that helping Socrates escape could expose him and the other
          friends to legal trouble, financial loss, and disgrace.
    - symbol: do_what_one_deems_right
      title: One must do the right
      body:
          A person ought to do what he judges right and must not betray the right
          once he recognizes it.
      axiom: background-assumption
    - symbol: escape_injures_laws
      title: Escape would wrong the laws
      body:
          Socrates reasons that escaping without the Athenians’ consent would injure
          the laws and the city rather than merely avoid punishment.
    - symbol: escape_harms_friends_and_city
      title: Escape would damage others
      body:
          The laws say escaping would exile or impoverish Socrates’s friends, make
          him an enemy of well-governed cities, and confirm the judges’
          condemnation.
    - symbol: dream_means_phthia
      title: The dream predicts departure
      body:
          Socrates’s dream of a woman saying “The third day hence to fertile Phthia
          shalt thou go” points to his death occurring after a short delay.
    - symbol: citizen_contract_obedience
      title: Residence implies agreement
      body:
          The laws claim that an adult who remains in the city after knowing its
          ways has implicitly agreed to obey its commands or persuade it otherwise.
      axiom: domain-rule
    - symbol: escape_preserves_children
      title: Escape would aid his children
      body:
          Crito argues that Socrates should escape so he can raise and educate his
          children rather than abandoning them to orphanhood.
    - symbol: shipArrivalImpends
      title: The Delos ship nears arrival
      body:
          The ship from Delos has not yet arrived, but it will probably arrive that
          day; therefore the next day will be Socrates’s last day of life.
    - symbol: escape_would_save_socrates
      title: Crito urges escape
      body:
          Crito urges Socrates to escape from prison, offering money, help, and
          exile as practical means to avoid execution.
    - symbol: escape_help_available
      title: Helpers stand ready
      body:
          Several people, including Simmias, Cebes, and others, are prepared to
          provide money and assistance for Socrates’s escape.
    - symbol: thessaly_safe_refuge
      title: Thessaly offers refuge
      body:
          Crito says Socrates can live safely with friends in Thessaly, where no one
          will trouble him.
    - symbol: socrates_long_residency
      title: Socrates accepted the city
      body:
          The laws argue that Socrates stayed in Athens for seventy years, rarely
          traveled, and therefore showed continued attachment to the city and its
          laws.
    - symbol: socrates_accepts_divine_will
      title: Socrates accepts divine will
      body:
          Socrates is willing to die if that is God’s will, though he thinks the
          ship’s arrival will be delayed by a day.
    - symbol: laws_bring_citizen_up
      title: The laws formed Socrates
      body: The laws claim they brought Socrates into existence, regulated his
          upbringing and education, and gave him the benefits of civic order.
      axiom: domain-rule
    - symbol: public_opinion_unworthy
      title: The many are not authoritative
      body:
          Socrates holds that the opinion of the many should not guide action; only
          the judgment of good and wise people deserves regard.
      axiom: background-assumption
